name: lab03-testes
on:
  push:
    paths:
      - "lab03-metricas-dora/**"
      - ".github/workflows/lab03-testes.yml"
  pull_request:
    paths:
      - "lab03-metricas-dora/**"
      - ".github/workflows/lab03-testes.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab03-metricas-dora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
